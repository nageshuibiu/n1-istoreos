name: Build iStoreOS for N1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build.env
        run: |
          grep -E '^[A-Z_]+=' build.env >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev \
            file wget libelf-dev

      - name: Clone iStoreOS source (pinned commit)
        run: |
          git clone --single-branch -b "$ISTOREOS_BRANCH" "$ISTOREOS_REPO" openwrt
          cd openwrt
          git checkout "$ISTOREOS_COMMIT"
          git log --oneline -1

      - name: Restore pinned feeds
        run: |
          cp feeds.conf openwrt/feeds.conf
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (official seed + kmod-nft-queue)
        run: |
          cp config.seed openwrt/.config
          cd openwrt
          make defconfig

      - name: Verify Open-Box deps selected
        run: |
          cd openwrt
          for p in kmod-tun kmod-nft-queue kmod-nft-nat kmod-veth ip-full ca-bundle; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "OK  $p"
            else
              echo "MISSING $p" && exit 1
            fi
          done

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp openwrt/bin/targets/amlogic/meson/*n1*.img.gz artifacts/
          cp openwrt/.config artifacts/full.config
          cd openwrt && ./scripts/diffconfig.sh > ../artifacts/config.buildinfo
          ls -la ../artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N1-iStoreOS-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
